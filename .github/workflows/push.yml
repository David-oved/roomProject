name: שליחת התראות

on:
  schedule:
    # כל 5 דקות — התדירות המקסימלית שגיטהאב מאפשר. GitHub לא מבטיח דיוק — עיכוב של 5–20 דקות שכיח,
    # ולכן ההתראות המיידיות מוגבלות לאירועים שסובלים השהיה כזו.
    - cron: '*/5 * * * *'
  workflow_dispatch: # הרצה ידנית לבדיקה

# ריצה אחת בכל רגע. שתי ריצות במקביל היו שולחות את אותה התראה פעמיים.
concurrency:
  group: push-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: שליחת התראות ממתינות
        run: node scripts/send-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
