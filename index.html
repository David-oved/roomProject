<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover חיוני: בלעדיו env(safe-area-inset-*) מחזיר 0
         והתוכן נחתך מתחת ל-Dynamic Island / הנאץ' באייפון -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="ניהול קניות, מוצרים חסרים וחלוקת הוצאות בחדר משותף" />
    <meta name="color-scheme" content="light" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomMate" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>RoomMate — ניהול חדר משותף</title>
  </head>
  <body>
    <div id="root">
      <!-- מסך פתיחה שמוצג לפני שה-JS נטען. נמחק ע"י main.tsx -->
      <div id="boot-splash">
        <div class="boot-logo">🏠</div>
        <div class="boot-name">RoomMate</div>
        <div class="boot-bar"><span></span></div>
        <div id="boot-error" hidden>
          <p class="boot-error-title">לא הצלחנו לטעון את האפליקציה</p>
          <p class="boot-error-body">בדקו את החיבור לאינטרנט ונסו שוב.</p>
          <button type="button" onclick="location.reload()">רענון</button>
        </div>
      </div>
    </div>

    <script>
      /*
       * פתח מילוט אוטומטי.
       *
       * אם React לא הספיק להסיר את מסך הפתיחה תוך 10 שניות, הקוד
       * שה-Service Worker מגיש שבור. במצב הזה האפליקציה לא יכולה לתקן
       * את עצמה — היא בכלל לא רצה. לכן הסקריפט הזה יושב ב-HTML עצמו,
       * רץ לפני כל קוד אחר, ולא תלוי בשום דבר שעלול להישבר.
       *
       * ניסיון אחד בלבד לכל סשן: מנקה Service Worker ומטמונים, ומרענן.
       * אם גם זה לא עזר — מציג הודעה ברורה במקום ספינר אינסופי.
       */
      (function () {
        var RECOVER_KEY = 'rm:boot-recover';

        function showError() {
          var err = document.getElementById('boot-error');
          if (err) err.hidden = false;
        }

        window.setTimeout(function () {
          if (!document.getElementById('boot-splash')) return; // עלה בהצלחה

          var tried = false;
          try {
            tried = sessionStorage.getItem(RECOVER_KEY) === '1';
          } catch (e) {}

          if (tried) {
            showError();
            return;
          }

          try {
            sessionStorage.setItem(RECOVER_KEY, '1');
          } catch (e) {}

          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(
                    rs.map(function (r) {
                      return r.unregister();
                    })
                  );
                })
              );
            }
            if (window.caches) {
              jobs.push(
                caches.keys().then(function (ks) {
                  return Promise.all(
                    ks.map(function (k) {
                      return caches.delete(k);
                    })
                  );
                })
              );
            }
          } catch (e) {}

          function reload() {
            location.replace(location.pathname + '?_r=' + Date.now());
          }
          Promise.all(jobs).then(reload, reload);
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
