<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!--
      ═══════════════════════════════════════════════════════════════
        Content-Security-Policy
      ═══════════════════════════════════════════════════════════════

      חייב להיות ה-meta הראשון אחרי charset: מדיניות ב-meta חלה רק על
      משאבים שמוצהרים **אחריה**. אם היא תרד מתחת ל-<link> של הפונטים,
      הפונטים כבר יהיו בדרך והמדיניות לא תחול עליהם.

      כל מקור כאן נספר מהקוד בפועל, לא מהניחוש:
        fonts.googleapis.com / fonts.gstatic.com  ← ה-<link> למטה
        *.googleapis.com                          ← Firebase Auth
                                                    (identitytoolkit,
                                                     securetoken)
        *.firebasedatabase.app / *.firebaseio.com ← RTDB. חובה גם wss:
                                                    — ה-SDK עובר ל-
                                                    WebSocket מיד אחרי
                                                    ה-handshake, ובלי
                                                    זה החדר לא נטען.
        api.cloudinary.com                        ← העלאת אווטאר
                                                    (avatarService.ts)
        res.cloudinary.com                        ← הצגת האווטאר שנשמר
        firebasestorage.googleapis.com            ← אווטארים היסטוריים
                                                    מלפני המעבר ל-
                                                    Cloudinary. עדיין
                                                    יש כאלה בנתונים.
        *.workers.dev                             ← ה-Worker של הפוש
                                                    (VITE_PUSH_ENDPOINT,
                                                    worker/wrangler.toml
                                                    name = roommate-push)
        127.0.0.1 / localhost                     ← אמולטורי Firebase
                                                    בפיתוח. אותו קובץ
                                                    HTML מוגש גם ב-dev,
                                                    ובלי זה `npm run emu`
                                                    מת.

      ⚠️ אם ה-Worker יעבור לדומיין מותאם — להוסיף אותו ל-connect-src,
         אחרת הפוש המיידי ייחסם. (לא נפילה: ההתראה עדיין תצא תוך 5
         דקות מה-GitHub Action, ראו worker/src/index.js.)

      'unsafe-inline' ב-script-src נדרש לסקריפט המילוט שבתחתית הקובץ.
      הוא חייב להיות inline מעצם תפקידו — הוא רץ כשקוד ה-Service Worker
      שבור, ולכן אסור לו להיות תלוי בשום קובץ חיצוני.
      ב-style-src נדרש בגלל style={{...}} של React ותוספות זמן-ריצה.

      ⚠️ frame-ancestors **מתעלמים ממנו** ב-meta (כך בתקן; רק
         report-uri ו-sandbox חולקים את הגורל הזה). הוא נשאר כאן
         כתיעוד כוונה — לאכיפה אמיתית צריך כותרת HTTP מהאירוח.
         GitHub Pages אינו מאפשר כותרות מותאמות; אם האתר יעבור לאירוח
         שכן מאפשר (Firebase Hosting / Cloudflare), יש להוסיף שם
         Content-Security-Policy: frame-ancestors 'none' וגם
         X-Frame-Options: DENY.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'none';
        object-src 'none';
        form-action 'self';
        frame-ancestors 'none';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob: https://res.cloudinary.com https://firebasestorage.googleapis.com;
        manifest-src 'self';
        worker-src 'self' blob:;
        connect-src 'self' data:
          https://*.googleapis.com
          https://*.firebaseio.com wss://*.firebaseio.com
          https://*.firebasedatabase.app wss://*.firebasedatabase.app
          https://api.cloudinary.com https://res.cloudinary.com
          https://*.workers.dev
          http://127.0.0.1:* ws://127.0.0.1:*
          http://localhost:* ws://localhost:*;
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- viewport-fit=cover חיוני: בלעדיו env(safe-area-inset-*) מחזיר 0
         והתוכן נחתך מתחת ל-Dynamic Island / הנאץ' באייפון -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="ניהול קניות, מוצרים חסרים וחלוקת הוצאות בחדר משותף" />
    <meta name="color-scheme" content="light" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomMate" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>RoomMate — ניהול חדר משותף</title>
  </head>
  <body>
    <div id="root">
      <!-- מסך פתיחה שמוצג לפני שה-JS נטען. נמחק ע"י main.tsx -->
      <div id="boot-splash">
        <div class="boot-logo">🏠</div>
        <div class="boot-name">RoomMate</div>
        <div class="boot-bar"><span></span></div>
        <div id="boot-error" hidden>
          <p class="boot-error-title">לא הצלחנו לטעון את האפליקציה</p>
          <p class="boot-error-body">בדקו את החיבור לאינטרנט ונסו שוב.</p>
          <button type="button" onclick="location.reload()">רענון</button>
        </div>
      </div>
    </div>

    <script>
      /*
       * פתח מילוט אוטומטי.
       *
       * אם React לא הספיק להסיר את מסך הפתיחה תוך 10 שניות, הקוד
       * שה-Service Worker מגיש שבור. במצב הזה האפליקציה לא יכולה לתקן
       * את עצמה — היא בכלל לא רצה. לכן הסקריפט הזה יושב ב-HTML עצמו,
       * רץ לפני כל קוד אחר, ולא תלוי בשום דבר שעלול להישבר.
       *
       * ניסיון אחד בלבד לכל סשן: מנקה Service Worker ומטמונים, ומרענן.
       * אם גם זה לא עזר — מציג הודעה ברורה במקום ספינר אינסופי.
       */
      (function () {
        var RECOVER_KEY = 'rm:boot-recover';

        function showError() {
          var err = document.getElementById('boot-error');
          if (err) err.hidden = false;
        }

        window.setTimeout(function () {
          if (!document.getElementById('boot-splash')) return; // עלה בהצלחה

          var tried = false;
          try {
            tried = sessionStorage.getItem(RECOVER_KEY) === '1';
          } catch (e) {}

          if (tried) {
            showError();
            return;
          }

          try {
            sessionStorage.setItem(RECOVER_KEY, '1');
          } catch (e) {}

          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(
                    rs.map(function (r) {
                      return r.unregister();
                    })
                  );
                })
              );
            }
            if (window.caches) {
              jobs.push(
                caches.keys().then(function (ks) {
                  return Promise.all(
                    ks.map(function (k) {
                      return caches.delete(k);
                    })
                  );
                })
              );
            }
          } catch (e) {}

          function reload() {
            location.replace(location.pathname + '?_r=' + Date.now());
          }
          Promise.all(jobs).then(reload, reload);
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
